services:
  gateway:
    build: .
    ports:
      - "8099:8000"
    env_file: .env
    volumes:
      - ./data:/data            # tokens (Claude e Codex), config e cwds — sobrevivem a restarts
      - ./workspace:/workspace  # raiz de trabalho do modo agente
      # Opcional (somente dev): reusar o login de assinatura da máquina.
      # Em VPS prefira `claude setup-token` + POST /auth/token.
      # - ~/.claude:/home/app/.claude
    restart: unless-stopped
